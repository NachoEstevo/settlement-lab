x-postgres: &postgres
  image: postgres:18.7-trixie@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
  restart: "no"
  environment:
    POSTGRES_DB: settlement_lab
    POSTGRES_USER: settlement_lab
    POSTGRES_PASSWORD: settlement_lab
  ports:
    - "127.0.0.1::5432"
  healthcheck:
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "settlement_lab", "-d", "settlement_lab"]
    interval: 1s
    timeout: 3s
    retries: 90

services:
  primary:
    <<: *postgres
    volumes:
      - primary_data:/var/lib/postgresql
      - ./init-primary.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
  standby:
    <<: *postgres
    depends_on:
      primary:
        condition: service_healthy
    entrypoint: ["bash", "/bootstrap-standby.sh"]
    volumes:
      - standby_data:/var/lib/postgresql
      - ./bootstrap-standby.sh:/bootstrap-standby.sh:ro

volumes:
  primary_data:
  standby_data:
