name: PostgreSQL failover
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  failover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the application and run failover regressions
        run: |
          ./gradlew --no-daemon test installDist
          python -m unittest discover -s failover -p 'test_*.py'
      - name: Run six physical failovers and verify the stored bundle offline
        run: |
          python failover/run.py --mode both --repetitions 3 --out build/failover-evidence
          python failover/verify.py build/failover-evidence
      - name: Preserve client logs, PostgreSQL evidence, and measured timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failover-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: build/failover-evidence/
          if-no-files-found: warn
