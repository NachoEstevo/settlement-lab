name: Settlement checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and run the reference cycle
        shell: bash
        run: |
          ./gradlew --no-daemon test
          ./gradlew -q run --args="demo cycle"

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Exercise PostgreSQL contention and recovery
        run: bash scripts/test-postgres.sh
