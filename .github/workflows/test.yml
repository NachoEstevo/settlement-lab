name: Settlement checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and run the reference cycle
        shell: bash
        run: |
          ./gradlew --no-daemon test
          ./gradlew -q run --args="demo cycle"
