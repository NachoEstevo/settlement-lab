name: Package distribution
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon distZip
      - uses: actions/upload-artifact@v4
        with:
          name: settlement-lab-0.1.0
          path: build/distributions/settlement-lab-0.1.0.zip
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: archive
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: settlement-lab-0.1.0
          path: ${{ runner.temp }}/package
      - name: Run the extracted Linux launcher and database race
        if: runner.os == 'Linux'
        run: python scripts/pack-smoke.py "${{ runner.temp }}/package/settlement-lab-0.1.0.zip" --postgres
      - name: Run the extracted Windows launcher
        if: runner.os == 'Windows'
        run: python scripts/pack-smoke.py "${{ runner.temp }}/package/settlement-lab-0.1.0.zip"
