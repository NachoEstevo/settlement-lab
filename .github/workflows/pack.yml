name: Package distribution
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      package: ${{ steps.dist.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build the versioned archive
        id: dist
        run: |
          ./gradlew --no-daemon distZip
          shopt -s nullglob
          archives=(build/distributions/settlement-lab-*.zip)
          test "${#archives[@]}" -eq 1
          echo "package=$(basename "${archives[0]}" .zip)" >> "$GITHUB_OUTPUT"
          echo "zip=${archives[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.package }}
          path: ${{ steps.dist.outputs.zip }}
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: archive
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.archive.outputs.package }}
          path: ${{ runner.temp }}/package
      - name: Run the extracted Linux launcher, database race and failover experiment
        if: runner.os == 'Linux'
        run: python scripts/pack-smoke.py "${{ runner.temp }}/package/${{ needs.archive.outputs.package }}.zip" --postgres --failover-evidence "${{ runner.temp }}/promotion-evidence"
      - name: Run the extracted Windows launcher
        if: runner.os == 'Windows'
        run: python scripts/pack-smoke.py "${{ runner.temp }}/package/${{ needs.archive.outputs.package }}.zip"
      - name: Save the evidence produced by the packaged experiment
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.archive.outputs.package }}-failover-evidence
          path: ${{ runner.temp }}/promotion-evidence
          if-no-files-found: ignore
