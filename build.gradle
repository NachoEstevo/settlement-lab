plugins {
    id 'application'
}

version = '0.2.0'

distributions.main.contents {
    from('compose.yaml')
    from('docs/distribution.md') {
        rename { 'README.md' }
    }
    from(projectDir) {
        include 'LICENSE', 'LICENSE.*', 'THIRD_PARTY_NOTICES*', 'notices/**'
    }
    from('failover') {
        into 'failover'
        include '*.py', 'compose.yaml'
        exclude 'test_*.py'
    }
    from('failover') {
        into 'failover'
        include '*.sh'
        filePermissions { unix('rwxr-xr-x') }
    }
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'lab.settlement.cli.Main'
    // pgJDBC sends the JVM zone at startup. UTC also exists in minimal server tzdata.
    applicationDefaultJvmArgs = ['-Duser.timezone=UTC']
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.14'
    implementation 'org.flywaydb:flyway-core:13.13.0'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql:13.13.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.23.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testImplementation 'net.jqwik:jqwik-api:1.9.3'
    testRuntimeOnly 'net.jqwik:jqwik-engine:1.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    systemProperty 'user.timezone', 'UTC'
    systemProperty 'jqwik.database', layout.buildDirectory.file("${name}.jqwik-database").get().asFile
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Run the integration suite against a live PostgreSQL 18 instance.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    // The selected database and its current state are external to Gradle.
    outputs.upToDateWhen { false }
}
